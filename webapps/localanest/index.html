<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Regional Anesthesia Calculator</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a0f1a;
            color: #e2e8f0;
            padding: 10px;
            min-height: 100vh;
        }
        .header {
            background: linear-gradient(135deg, #1e3a5f 0%, #0a0f1a 100%);
            border-radius: 18px;
            padding: 14px;
            margin-bottom: 12px;
            border: 1px solid #2d4a6e;
            text-align: center;
        }
        h1 { font-size: 19px; color: #fff; }
        .disclaimer {
            background: #7f1d1d;
            color: #fecaca;
            padding: 8px 12px;
            border-radius: 12px;
            font-size: 10px;
            margin-bottom: 12px;
            text-align: center;
        }
        .tabs {
            display: flex;
            gap: 4px;
            margin-bottom: 12px;
            background: #1e293b;
            padding: 4px;
            border-radius: 14px;
        }
        .tab {
            flex: 1;
            padding: 10px 4px;
            background: transparent;
            border: none;
            color: #94a3b8;
            font-size: 11px;
            font-weight: 600;
            border-radius: 11px;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
        }
        .tab.active { background: #3b82f6; color: white; }
        .card {
            background: #111827;
            border-radius: 16px;
            padding: 14px;
            margin-bottom: 10px;
            border: 1px solid #2d3748;
        }
        .card-title {
            font-size: 14px;
            color: #93c5fd;
            margin-bottom: 10px;
            font-weight: 600;
        }
        .input-group { margin-bottom: 10px; }
        label {
            display: block;
            font-size: 11px;
            color: #9ca3af;
            margin-bottom: 4px;
            font-weight: 500;
        }
        input, select {
            width: 100%;
            padding: 10px 12px;
            background: #0a0f1a;
            border: 1.5px solid #334155;
            border-radius: 12px;
            color: white;
            font-size: 14px;
        }
        input:focus, select:focus { outline: none; border-color: #3b82f6; }
        .row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .row-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; }
        .result {
            background: linear-gradient(145deg, #111827 0%, #0a0f1a 100%);
            border-radius: 14px;
            padding: 12px;
            border: 1px solid #2d4a6e;
            margin-bottom: 10px;
        }
        .result-row {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            padding: 7px 0;
            border-bottom: 1px solid #1e293b;
        }
        .result-row:last-child { border-bottom: none; }
        .result-label { color: #9ca3af; font-size: 11px; }
        .result-value { font-size: 15px; font-weight: 700; color: #fbbf24; }
        .result-unit { font-size: 10px; color: #6b7280; font-weight: 400; margin-left: 2px; }
        .warning {
            padding: 8px 12px;
            border-radius: 10px;
            font-size: 11px;
            line-height: 1.4;
            margin-top: 8px;
            border-left: 3px solid #f59e0b;
        }
        .warning.success { background: #14532d; color: #bbf7d0; border-left-color: #22c55e; }
        .warning.danger { background: #450a0a; color: #fecaca; border-left-color: #ef4444; }
        .warning.info { background: #1e3a5f; color: #bfdbfe; border-left-color: #3b82f6; }
        .hidden { display: none !important; }
        .dermatome-info {
            background: #0a0f1a;
            border-radius: 10px;
            padding: 10px;
            margin: 8px 0;
            font-size: 11px;
            color: #94a3b8;
            line-height: 1.5;
            border: 1px solid #2d3748;
        }
        .dermatome-key { color: #fbbf24; font-weight: 600; }
        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 0;
        }
        .checkbox-group input { width: 18px; height: 18px; accent-color: #3b82f6; }
        .btn-sm {
            padding: 8px 14px;
            border-radius: 10px;
            border: 1.5px solid #3b82f6;
            background: transparent;
            color: #93c5fd;
            font-size: 12px;
            cursor: pointer;
            width: 100%;
            margin-top: 6px;
        }
        .last-drug-entry {
            background: #1a2333;
            padding: 10px;
            border-radius: 10px;
            margin-bottom: 8px;
            position: relative;
            border: 1px solid #2d3748;
        }
        .remove-drug {
            position: absolute;
            top: 6px;
            right: 6px;
            background: #ef4444;
            color: white;
            border: none;
            border-radius: 50%;
            width: 22px;
            height: 22px;
            font-weight: bold;
            cursor: pointer;
            font-size: 12px;
            line-height: 22px;
            text-align: center;
        }
        .range-display {
            color: #fbbf24;
            font-weight: 600;
            font-size: 13px;
        }
    </style>
</head>
<body>

<div class="header">
    <h1>🧬 Regional Anesthesia</h1>
</div>
<div class="disclaimer">⚕️ Для медичних працівників. Перевіряйте розрахунки.</div>

<!-- ==================== ЗАГАЛЬНІ ПОЛЯ ==================== -->
<div class="card">
    <div class="card-title">⚖️ Пацієнт</div>
    <div class="row-3">
        <div class="input-group">
            <label>Вага (кг)</label>
            <input type="number" id="global-weight" placeholder="70" min="1" max="300" step="0.1">
        </div>
        <div class="input-group">
            <label>Зріст (см)</label>
            <input type="number" id="global-height" placeholder="170" min="50" max="250">
        </div>
        <div class="input-group">
            <label>Вік</label>
            <input type="number" id="global-age" placeholder="45" min="18" max="110">
        </div>
    </div>
    <div class="input-group">
        <label>Стать</label>
        <select id="global-gender">
            <option value="male">Чоловік</option>
            <option value="female">Жінка</option>
        </select>
    </div>
</div>

<!-- ==================== ВКЛАДКИ ==================== -->
<div class="tabs">
    <button class="tab active" data-tab="spinal">💧 СМА</button>
    <button class="tab" data-tab="epidural">💉 Епідуральна</button>
    <button class="tab" data-tab="last">🧪 LAST</button>
</div>

<!-- ==================== СМА ==================== -->
<div id="tab-spinal" class="tab-content">
    <div class="card">
        <div class="card-title">📐 Параметри СМА</div>
        <div class="row-2">
            <div class="input-group">
                <label>Рівень пункції</label>
                <select id="spinal-puncture">
                    <option value="L5S1">L5–S1</option>
                    <option value="L4L5">L4–L5</option>
                    <option value="L3L4" selected>L3–L4</option>
                    <option value="L2L3">L2–L3</option>
                </select>
            </div>
            <div class="input-group">
                <label>Цільовий дерматом</label>
                <select id="spinal-target">
                    <option value="T12">T12 — пахвинна</option>
                    <option value="T10">T10 — пупок</option>
                    <option value="T8">T8 — епігастрій</option>
                    <option value="T6">T6 — мечоподібний</option>
                    <option value="T4" selected>T4 — соски</option>
                </select>
            </div>
        </div>
        <div class="input-group">
            <label>Препарат</label>
            <select id="spinal-drug">
                <option value="bupiv-heavy" selected>Бупівакаїн гіпербаричний 0.5%</option>
                <option value="bupiv-iso">Бупівакаїн ізобаричний 0.5%</option>
                <option value="ropiv">Ропівакаїн 0.5%</option>
                <option value="lido-heavy">Лідокаїн гіпербаричний 5%</option>
            </select>
        </div>
        <div class="input-group">
            <label>Фактори</label>
            <select id="spinal-factors">
                <option value="none">Без особливостей</option>
                <option value="pregnant">Вагітність (-30%)</option>
                <option value="elderly">Вік > 70 (-20%)</option>
                <option value="obese">Ожиріння (-15%)</option>
            </select>
        </div>
    </div>
    <div class="dermatome-info" id="spinal-derm-info"></div>
    <div class="result" id="spinal-result"></div>
    <div class="warning" id="spinal-warning"></div>
</div>

<!-- ==================== ЕПІДУРАЛЬНА ==================== -->
<div id="tab-epidural" class="tab-content hidden">
    <div class="card">
        <div class="card-title">📐 Параметри епідуральної</div>
        <div class="row-2">
            <div class="input-group">
                <label>Рівень пункції</label>
                <select id="epi-puncture">
                    <option value="T11T12">T11–T12 (для T4)</option>
                    <option value="T12L1">T12–L1 (для T6)</option>
                    <option value="L1L2" selected>L1–L2 (для T8–T10)</option>
                    <option value="L2L3">L2–L3 (для T12)</option>
                    <option value="L3L4">L3–L4 (для L1)</option>
                </select>
            </div>
            <div class="input-group">
                <label>Цільовий дерматом</label>
                <select id="epi-target">
                    <option value="T12">T12 — пахвинна</option>
                    <option value="T10">T10 — пупок</option>
                    <option value="T8">T8 — епігастрій</option>
                    <option value="T6">T6 — мечоподібний</option>
                    <option value="T4" selected>T4 — соски</option>
                </select>
            </div>
        </div>
        <div class="row-2">
            <div class="input-group">
                <label>Препарат</label>
                <select id="epi-drug">
                    <option value="ropiv075" selected>Ропівакаїн 0.75%</option>
                    <option value="lido2">Лідокаїн 2%</option>
                    <option value="bupiv05">Бупівакаїн 0.5%</option>
                </select>
            </div>
            <div class="input-group">
                <label>Фактори</label>
                <select id="epi-factors">
                    <option value="none">Без особливостей</option>
                    <option value="pregnant">Вагітність (-30%)</option>
                    <option value="elderly">Вік > 70 (-25%)</option>
                    <option value="obese">Ожиріння (-20%)</option>
                </select>
            </div>
        </div>
    </div>
    <div class="dermatome-info" id="epi-derm-info"></div>
    <div class="result" id="epi-result"></div>
    <div class="warning" id="epi-warning"></div>
</div>

<!-- ==================== LAST ==================== -->
<div id="tab-last" class="tab-content hidden">
    <div class="card">
        <div class="card-title">💊 Кошик препаратів</div>
        <div id="last-drugs-container"></div>
        <button class="btn-sm" id="add-last-drug">+ Додати препарат</button>
        <div class="input-group" style="margin-top: 10px;">
            <label>Вага для розрахунку</label>
            <select id="last-weight-type">
                <option value="actual">Фактична</option>
                <option value="ibw">Ідеальна (IBW)</option>
                <option value="adj">Скоригована (AdjBW)</option>
            </select>
        </div>
    </div>
    <div class="result" id="last-result"></div>
    <div class="warning" id="last-warning"></div>
</div>

<script>
(function() {
    // ==================== ДОПОМІЖНІ ====================
    function gVal(id) {
        const el = document.getElementById(id);
        if (!el || el.value.trim() === '') return null;
        const v = parseFloat(el.value);
        return isNaN(v) ? null : v;
    }
    function getW() { return gVal('global-weight') || 70; }
    function getH() { return gVal('global-height') || 170; }
    function getAge() { return gVal('global-age') || 45; }
    function getGen() { return document.getElementById('global-gender')?.value || 'male'; }

    function calcIBW(w, h, gen) {
        const inches = h / 2.54;
        const ibw = gen === 'male' ? 50 + 2.3*(inches-60) : 45.5 + 2.3*(inches-60);
        return Math.max(ibw, 30);
    }
    function calcAdjBW(w, ibw, h) {
        const bmi = w / ((h/100)**2);
        return bmi > 30 ? ibw + 0.4*(w - ibw) : w;
    }

    // ==================== ДЕРМАТОМИ ====================
    const DERM_MAP = {
        'S1':0,'S2':1,'L5':2,'L4':3,'L3':4,'L2':5,'L1':6,
        'T12':7,'T11':8,'T10':9,'T9':10,'T8':11,'T7':12,'T6':13,
        'T5':14,'T4':15,'T3':16,'T2':17,'T1':18
    };
    const PUNCTURE_MAP = {
        'L5S1':'S1','L4L5':'L4','L3L4':'L3','L2L3':'L2','L1L2':'L1',
        'T11T12':'T11','T12L1':'T12'
    };
    const DERM_NAMES = {
        'T12':'пахвинна складка','T10':'пупок','T8':'епігастрій',
        'T6':'мечоподібний відросток','T4':'соски','T2':'ключиці'
    };
    function countSegs(puncture, target) {
        const from = PUNCTURE_MAP[puncture] || 'L3';
        return Math.abs((DERM_MAP[target]||15) - (DERM_MAP[from]||4));
    }

    // ==================== СМА ====================
    function calcSpinal() {
        const puncture = document.getElementById('spinal-puncture').value;
        const target = document.getElementById('spinal-target').value;
        const drug = document.getElementById('spinal-drug').value;
        const factors = document.getElementById('spinal-factors').value;
        const age = getAge();
        const gender = getGen();
        const segs = countSegs(puncture, target);

        let volMin = 0.25, volMax = 0.35;
        let concMg = 5;
        let onset = '3–5 хв', duration = '3–5 год', drugName = '';

        if (drug === 'bupiv-heavy') {
            volMin = 0.25; volMax = 0.35; concMg = 5;
            drugName = 'Бупівакаїн гіперб. 0.5%';
        } else if (drug === 'bupiv-iso') {
            volMin = 0.3; volMax = 0.4; concMg = 5;
            drugName = 'Бупівакаїн ізобар. 0.5%';
            onset = '5–8 хв';
        } else if (drug === 'ropiv') {
            volMin = 0.25; volMax = 0.35; concMg = 5;
            drugName = 'Ропівакаїн 0.5%';
            onset = '5–8 хв'; duration = '2–4 год';
        } else if (drug === 'lido-heavy') {
            volMin = 0.2; volMax = 0.25; concMg = 50;
            drugName = 'Лідокаїн гіперб. 5%';
            onset = '2–3 хв'; duration = '1–2 год';
        }

        let volMinTotal = segs * volMin;
        let volMaxTotal = segs * volMax;
        let doseMin = volMinTotal * concMg;
        let doseMax = volMaxTotal * concMg;
        let note = '';

        if (factors === 'pregnant' && gender === 'female') {
            volMinTotal *= 0.7; volMaxTotal *= 0.7;
            doseMin *= 0.7; doseMax *= 0.7;
            note = '🤰 Вагітність: -30%';
        } else if (factors === 'pregnant' && gender === 'male') {
            note = '⚠️ "Вагітність" для чоловіка — корекцію не застосовано';
        }
        if (factors === 'elderly' || age > 70) {
            volMinTotal *= 0.8; volMaxTotal *= 0.8;
            doseMin *= 0.8; doseMax *= 0.8;
            note += (note ? ' | ' : '') + '👴 Вік: -20%';
        }
        if (factors === 'obese') {
            volMinTotal *= 0.85; volMaxTotal *= 0.85;
            doseMin *= 0.85; doseMax *= 0.85;
            note += (note ? ' | ' : '') + '⚖️ Ожиріння: -15%';
        }

        document.getElementById('spinal-derm-info').innerHTML = `
            📍 <span class="dermatome-key">${puncture}</span> → 🎯 <span class="dermatome-key">${target}</span> (${DERM_NAMES[target]}) | 
            📏 Сегментів: <span class="dermatome-key">${segs}</span> | 
            💊 ${drugName}
        `;

        document.getElementById('spinal-result').innerHTML = `
            <div class="result-row">
                <span class="result-label">Рекомендований об'єм:</span>
                <span class="range-display">${volMinTotal.toFixed(1)}–${volMaxTotal.toFixed(1)} мл</span>
            </div>
            <div class="result-row">
                <span class="result-label">Доза:</span>
                <span class="range-display">${doseMin.toFixed(1)}–${doseMax.toFixed(1)} мг</span>
            </div>
            <div class="result-row"><span class="result-label">Початок:</span><span class="result-value">${onset}</span></div>
            <div class="result-row"><span class="result-label">Тривалість:</span><span class="result-value">${duration}</span></div>
        `;

        const wEl = document.getElementById('spinal-warning');
        wEl.textContent = note || '✅ Стандартний розрахунок';
        wEl.className = note.includes('⚠️') ? 'warning danger' : note ? 'warning info' : 'warning success';
    }

    // ==================== ЕПІДУРАЛЬНА ====================
    function calcEpi() {
        const puncture = document.getElementById('epi-puncture').value;
        const target = document.getElementById('epi-target').value;
        const drug = document.getElementById('epi-drug').value;
        const factors = document.getElementById('epi-factors').value;
        const age = getAge();
        const gender = getGen();
        const weight = getW();
        const segs = countSegs(puncture, target);

        let volPerSeg = 1.5;
        let concMg = 7.5, maxMg = 200, drugName = 'Ропівакаїн 0.75%';
        if (drug === 'lido2') { volPerSeg = 1.2; concMg = 20; maxMg = 400; drugName = 'Лідокаїн 2%'; }
        else if (drug === 'bupiv05') { volPerSeg = 1.3; concMg = 5; maxMg = 150; drugName = 'Бупівакаїн 0.5%'; }

        let vol = segs * volPerSeg;
        let dose = vol * concMg;
        let note = '';

        if (factors === 'pregnant' && gender === 'female') {
            vol *= 0.7; dose *= 0.7;
            note = '🤰 Вагітність: -30%';
        } else if (factors === 'pregnant' && gender === 'male') {
            note = '⚠️ "Вагітність" для чоловіка — корекцію не застосовано';
        }
        if (factors === 'elderly' || age > 70) {
            vol *= 0.75; dose *= 0.75;
            note += (note ? ' | ' : '') + '👴 Вік: -25%';
        }
        if (factors === 'obese') {
            vol *= 0.8;
            note += (note ? ' | ' : '') + '⚖️ Ожиріння: об\'єм -20%';
        }

        const pct = (dose / maxMg) * 100;

        document.getElementById('epi-derm-info').innerHTML = `
            📍 <span class="dermatome-key">${puncture}</span> → 🎯 <span class="dermatome-key">${target}</span> (${DERM_NAMES[target]}) | 
            📏 Сегментів: <span class="dermatome-key">${segs}</span> | 
            💊 ${drugName}
        `;

        document.getElementById('epi-result').innerHTML = `
            <div class="result-row"><span class="result-label">Об'єм болюсу:</span><span class="result-value">${vol.toFixed(1)}<span class="result-unit">мл</span></span></div>
            <div class="result-row"><span class="result-label">Доза:</span><span class="result-value">${dose.toFixed(0)}<span class="result-unit">мг (${(dose/weight).toFixed(1)} мг/кг)</span></span></div>
            <div class="result-row"><span class="result-label">% від макс. разової:</span><span class="result-value" style="color:${pct>80?'#ef4444':pct>50?'#f59e0b':'#22c55e'}">${pct.toFixed(0)}%</span></div>
        `;

        const wEl = document.getElementById('epi-warning');
        const warns = [note, pct > 80 ? `🔴 ${pct.toFixed(0)}% — перевищення безпечної дози!` : ''].filter(Boolean);
        wEl.innerHTML = warns.join('<br>') || '✅ Доза в безпечних межах';
        wEl.className = warns.length || note.includes('⚠️') ? 'warning danger' : 'warning success';
    }

    // ==================== LAST ====================
    const MAX_DOSES_LAST = {
        bupivacaine: { single: 2.5, daily: 400 },
        ropivacaine: { single: 3.0, daily: 800 },
        lidocaine: { single: 4.5, withEpiSingle: 7.0, daily: 300, withEpiDaily: 500 }
    };
    let lastDrugs = [];

    function getLastWeight() {
        const w = getW();
        const h = getH();
        const gen = getGen();
        const type = document.getElementById('last-weight-type').value;
        const ibw = calcIBW(w, h, gen);
        if (type === 'ibw') return ibw;
        if (type === 'adj') return calcAdjBW(w, ibw, h);
        return w;
    }

    function addLastDrug() {
        if (lastDrugs.length >= 5) return;
        lastDrugs.push({ id: Date.now(), drug: 'bupivacaine', conc: '', vol: '', epi: false });
        renderLastDrugs();
        calcLast();
    }
    function removeLastDrug(id) {
        lastDrugs = lastDrugs.filter(d => d.id !== id);
        renderLastDrugs();
        calcLast();
    }

    function renderLastDrugs() {
        const container = document.getElementById('last-drugs-container');
        container.innerHTML = '';
        lastDrugs.forEach(d => {
            const div = document.createElement('div');
            div.className = 'last-drug-entry';
            div.innerHTML = `
                <button class="remove-drug" data-id="${d.id}">&times;</button>
                <div class="row-2">
                    <div class="input-group">
                        <label>Препарат</label>
                        <select class="last-drug-sel" data-id="${d.id}">
                            <option value="bupivacaine" ${d.drug==='bupivacaine'?'selected':''}>Бупівакаїн</option>
                            <option value="ropivacaine" ${d.drug==='ropivacaine'?'selected':''}>Ропівакаїн</option>
                            <option value="lidocaine" ${d.drug==='lidocaine'?'selected':''}>Лідокаїн</option>
                        </select>
                    </div>
                    <div class="input-group">
                        <label>Конц. (%)</label>
                        <input type="number" class="last-conc-inp" value="${d.conc}" placeholder="0.5" step="0.01" min="0" data-id="${d.id}">
                    </div>
                </div>
                <div class="input-group">
                    <label>Об'єм (мл)</label>
                    <input type="number" class="last-vol-inp" value="${d.vol}" placeholder="20" min="1" step="1" data-id="${d.id}">
                </div>
                ${d.drug === 'lidocaine' ? `
                <div class="checkbox-group">
                    <input type="checkbox" class="last-epi-cb" ${d.epi?'checked':''} data-id="${d.id}">
                    <label>+ Адреналін (5 мкг/мл)</label>
                </div>` : ''}
            `;
            container.appendChild(div);
        });

        document.querySelectorAll('.remove-drug').forEach(b => {
            b.addEventListener('click', () => removeLastDrug(parseInt(b.dataset.id)));
        });
        document.querySelectorAll('.last-drug-sel').forEach(s => {
            s.addEventListener('change', function() {
                const id = parseInt(this.dataset.id);
                const entry = lastDrugs.find(d => d.id === id);
                if (entry) { entry.drug = this.value; entry.epi = false; renderLastDrugs(); calcLast(); }
            });
        });
        document.querySelectorAll('.last-conc-inp, .last-vol-inp').forEach(i => {
            i.addEventListener('input', function() {
                const id = parseInt(this.dataset.id);
                const entry = lastDrugs.find(d => d.id === id);
                if (entry) {
                    if (this.classList.contains('last-conc-inp')) entry.conc = this.value;
                    else entry.vol = this.value;
                    calcLast();
                }
            });
        });
        document.querySelectorAll('.last-epi-cb').forEach(cb => {
            cb.addEventListener('change', function() {
                const id = parseInt(this.dataset.id);
                const entry = lastDrugs.find(d => d.id === id);
                if (entry) { entry.epi = this.checked; calcLast(); }
            });
        });
    }

    function calcLast() {
        const w = getLastWeight();
        const res = document.getElementById('last-result');
        const warn = document.getElementById('last-warning');

        if (lastDrugs.length === 0) {
            res.innerHTML = '<div class="result-row"><span class="result-label">Додайте препарати</span></div>';
            warn.textContent = ''; return;
        }

        let html = '';
        let dangers = [];
        let hasData = false;

        lastDrugs.forEach((d, i) => {
            const conc = parseFloat(d.conc);
            const vol = parseFloat(d.vol);
            if (isNaN(conc) || isNaN(vol) || vol <= 0) return;
            hasData = true;

            const mg = conc * 10 * vol;
            const mgKg = mg / w;
            const maxDose = MAX_DOSES_LAST[d.drug];
            const maxSingle = (d.drug === 'lidocaine' && d.epi) ? maxDose.withEpiSingle : maxDose.single;
            const pct = (mgKg / maxSingle) * 100;

            html += `<div class="result-row">
                <span class="result-label">${d.drug} #${i+1}:</span>
                <span class="result-value" style="color:${pct>80?'#ef4444':pct>50?'#f59e0b':'#22c55e'}">
                    ${pct.toFixed(0)}% <span style="font-size:10px;color:#9ca3af;">(${mg.toFixed(0)} мг / ${mgKg.toFixed(2)} мг/кг)</span>
                </span>
            </div>`;
            if (pct > 80) dangers.push(`🔴 ${d.drug} #${i+1}: ${pct.toFixed(0)}% від макс. разової дози!`);
        });

        res.innerHTML = html || '<div class="result-row"><span class="result-label">Введіть дані препаратів</span></div>';

        if (dangers.length) {
            warn.innerHTML = dangers.join('<br>') + '<br><small>⚠️ Токсичність НЕ адитивна! Оцінюйте кожен препарат окремо.</small>';
            warn.className = 'warning danger';
        } else if (hasData) {
            warn.textContent = '✅ Всі дози в безпечних межах';
            warn.className = 'warning success';
        } else {
            warn.textContent = '';
            warn.className = 'warning';
        }
    }

    // ==================== НАВІГАЦІЯ ====================
    function switchTab(tabId) {
        document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
        document.getElementById(`tab-${tabId}`).classList.remove('hidden');
        document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
        document.querySelector(`[data-tab="${tabId}"]`).classList.add('active');

        if (tabId === 'spinal') calcSpinal();
        else if (tabId === 'epidural') calcEpi();
        else if (tabId === 'last') calcLast();
    }

    function recalcCurrent() {
        const active = document.querySelector('.tab.active')?.dataset.tab;
        if (active === 'spinal') calcSpinal();
        else if (active === 'epidural') calcEpi();
        else if (active === 'last') calcLast();
    }

    // ==================== ІНІТ ====================
    document.addEventListener('DOMContentLoaded', () => {
        document.querySelectorAll('.tab').forEach(t => {
            t.addEventListener('click', () => switchTab(t.dataset.tab));
        });

        ['global-weight','global-height','global-age','global-gender'].forEach(id => {
            document.getElementById(id).addEventListener('input', recalcCurrent);
            document.getElementById(id).addEventListener('change', recalcCurrent);
        });

        ['spinal-puncture','spinal-target','spinal-drug','spinal-factors'].forEach(id => {
            document.getElementById(id).addEventListener('change', calcSpinal);
        });

        ['epi-puncture','epi-target','epi-drug','epi-factors'].forEach(id => {
            document.getElementById(id).addEventListener('change', calcEpi);
        });

        document.getElementById('add-last-drug').addEventListener('click', addLastDrug);
        document.getElementById('last-weight-type').addEventListener('change', calcLast);

        addLastDrug();
        calcSpinal();
    });
})();
</script>
</body>
</html>
