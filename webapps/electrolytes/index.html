<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Електролітний калькулятор</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            padding: 12px;
            min-height: 100vh;
        }
        .header {
            background: linear-gradient(135deg, #1e3a5f 0%, #0f172a 100%);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 16px;
            border: 1px solid #2d4a6e;
            text-align: center;
        }
        h1 { font-size: 20px; color: #fff; }
        .disclaimer {
            background: #7f1d1d;
            color: #fecaca;
            padding: 10px;
            border-radius: 12px;
            font-size: 11px;
            margin-bottom: 16px;
            text-align: center;
        }
        .tabs {
            display: flex;
            gap: 4px;
            margin-bottom: 16px;
            background: #1e293b;
            padding: 4px;
            border-radius: 14px;
        }
        .tab {
            flex: 1;
            padding: 12px 4px;
            background: transparent;
            border: none;
            color: #94a3b8;
            font-size: 13px;
            font-weight: 600;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .tab.active { background: #3b82f6; color: white; }
        .card {
            background: #1e293b;
            border-radius: 18px;
            padding: 16px;
            margin-bottom: 14px;
            border: 1px solid #334155;
        }
        .card-title {
            font-size: 15px;
            color: #93c5fd;
            margin-bottom: 14px;
            font-weight: 600;
        }
        .input-group { margin-bottom: 14px; }
        label {
            display: block;
            font-size: 12px;
            color: #94a3b8;
            margin-bottom: 5px;
        }
        input, select {
            width: 100%;
            padding: 12px;
            background: #0f172a;
            border: 1.5px solid #334155;
            border-radius: 12px;
            color: white;
            font-size: 15px;
        }
        input:focus, select:focus {
            outline: none;
            border-color: #3b82f6;
        }
        .row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .result {
            background: linear-gradient(145deg, #1e293b 0%, #0f172a 100%);
            border-radius: 18px;
            padding: 16px;
            border: 1px solid #2d4a6e;
            margin-bottom: 14px;
        }
        .result-row {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            padding: 10px 0;
            border-bottom: 1px solid #334155;
        }
        .result-row:last-child { border-bottom: none; }
        .result-label { color: #94a3b8; font-size: 13px; }
        .result-value { font-size: 18px; font-weight: 700; color: #fbbf24; }
        .result-unit { font-size: 12px; color: #64748b; font-weight: 400; }
        .warning {
            background: #422006;
            color: #fde68a;
            padding: 12px;
            border-radius: 12px;
            font-size: 12px;
            line-height: 1.4;
        }
        .warning.danger { background: #450a0a; color: #fecaca; }
        .button {
            width: 100%;
            padding: 14px;
            background: #3b82f6;
            color: white;
            border: none;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 8px;
        }
        .button:active { background: #2563eb; }
        .hidden { display: none !important; }
        .protocol-badge {
            background: #1e3a5f;
            color: #93c5fd;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 11px;
            display: inline-block;
            margin-top: 6px;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🧪 Електролітний калькулятор</h1>
        <span class="protocol-badge">фомули розрахунку з ESCIM 2025 • KDIGO 2024 • UpToDate 2026</span>
    </div>

    <div class="disclaimer">
        ⚕️ Для медичних працівників. Перевіряйте розрахунки. Не замінює клінічне мислення.
    </div>

    <div class="tabs">
        <button class="tab active" data-tab="na">🧂 Na⁺</button>
        <button class="tab" data-tab="k">⚡ K⁺</button>
        <button class="tab" data-tab="ca">🦴 Ca²⁺</button>
        <button class="tab" data-tab="mg">💊 Mg²⁺</button>
    </div>

    <!-- ==================== НАТРІЙ ==================== -->
    <div id="tab-na" class="tab-content">
        <div class="card">
            <div class="card-title">👤 Дані пацієнта</div>
            <div class="row-2">
                <div class="input-group">
                    <label>Вага (кг)</label>
                    <input type="number" id="na-weight" value="70" min="20" max="300" step="0.1">
                </div>
                <div class="input-group">
                    <label>Вік (років)</label>
                    <input type="number" id="na-age" value="45" min="18" max="110">
                </div>
            </div>
            <div class="input-group">
                <label>Стать</label>
                <select id="na-gender">
                    <option value="male">Чоловік</option>
                    <option value="female">Жінка</option>
                </select>
            </div>
        </div>

        <div class="card">
            <div class="card-title">🔬 Лабораторні дані</div>
            <div class="row-2">
                <div class="input-group">
                    <label>Na⁺ зараз (ммоль/л)</label>
                    <input type="number" id="na-current" value="118" min="100" max="180" step="1">
                </div>
                <div class="input-group">
                    <label>Na⁺ цільовий (ммоль/л)</label>
                    <input type="number" id="na-target" value="128" min="110" max="155" step="1">
                </div>
            </div>
            <div class="input-group">
                <label>Характер порушення</label>
                <select id="na-chronicity">
                    <option value="acute">Гостре (&lt;48 год)</option>
                    <option value="chronic" selected>Хронічне (&gt;48 год)</option>
                </select>
            </div>
            <div class="input-group">
                <label>Розчин для корекції</label>
                <select id="na-solution">
                    <option value="154">NaCl 0.9% (154 ммоль/л)</option>
                    <option value="513" selected>NaCl 3% (513 ммоль/л)</option>
                    <option value="1000">NaCl 5.85% (1000 ммоль/л)</option>
                </select>
            </div>
        </div>

        <div class="result" id="na-result"></div>
        <div class="warning" id="na-warning"></div>
    </div>

    <!-- ==================== КАЛІЙ ==================== -->
    <div id="tab-k" class="tab-content hidden">
        <div class="card">
            <div class="card-title">👤 Дані пацієнта</div>
            <div class="input-group">
                <label>Вага (кг)</label>
                <input type="number" id="k-weight" value="70" min="20" max="300" step="0.1">
            </div>
        </div>

        <div class="card">
            <div class="card-title">🔬 Лабораторні дані</div>
            <div class="row-2">
                <div class="input-group">
                    <label>K⁺ зараз (ммоль/л)</label>
                    <input type="number" id="k-current" value="2.8" min="1.5" max="8.0" step="0.1">
                </div>
                <div class="input-group">
                    <label>K⁺ цільовий (ммоль/л)</label>
                    <input type="number" id="k-target" value="4.0" min="3.5" max="5.0" step="0.1">
                </div>
            </div>
            <div class="input-group">
                <label>Концентрація KCl</label>
                <select id="k-solution">
                    <option value="4" selected>KCl 4% — 0.536 ммоль/мл</option>
                    <option value="7.5">KCl 7.5% — 1.0 ммоль/мл</option>
                </select>
            </div>
            <div class="input-group">
                <label>Функція нирок (ШКФ)</label>
                <select id="k-renal">
                    <option value="normal">Нормальна (&gt;60 мл/хв)</option>
                    <option value="impaired">Порушена (30–60 мл/хв)</option>
                    <option value="severe">Тяжка (&lt;30 мл/хв)</option>
                </select>
            </div>
        </div>

        <div class="result" id="k-result"></div>
        <div class="warning" id="k-warning"></div>
    </div>

    <!-- ==================== КАЛЬЦІЙ ==================== -->
    <div id="tab-ca" class="tab-content hidden">
        <div class="card">
            <div class="card-title">🔬 Лабораторні дані</div>
            <div class="input-group">
                <label>Ca²⁺ іонізований (ммоль/л)</label>
                <input type="number" id="ca-current" value="0.85" min="0.4" max="2.5" step="0.01">
            </div>
            <div class="input-group">
                <label>Альбумін</label>
                <input type="number" id="ca-albumin" value="35" min="15" max="60" step="1">
                <select id="ca-albumin-unit" style="margin-top: 6px;">
                    <option value="gl" selected>г/л (норма 35-50)</option>
                    <option value="gdl">г/дл (норма 3.5-5.0)</option>
                </select>
            </div>
            <div class="input-group">
                <label>Препарат</label>
                <select id="ca-drug">
                    <option value="gluconate" selected>Кальцію глюконат 10% (0.22 ммоль/мл)</option>
                    <option value="chloride">Кальцію хлорид 10% (0.68 ммоль/мл)</option>
                </select>
            </div>
        </div>

        <div class="result" id="ca-result"></div>
        <div class="warning" id="ca-warning"></div>
    </div>

    <!-- ==================== МАГНІЙ ==================== -->
    <div id="tab-mg" class="tab-content hidden">
        <div class="card">
            <div class="card-title">🔬 Лабораторні дані</div>
            <div class="input-group">
                <label>Mg²⁺ зараз (ммоль/л)</label>
                <input type="number" id="mg-current" value="0.55" min="0.2" max="3.0" step="0.05">
            </div>
            <div class="input-group">
                <label>Клінічна ситуація</label>
                <select id="mg-indication">
                    <option value="routine">Планова корекція</option>
                    <option value="severe">Тяжка гіпомагніємія (&lt;0.5 ммоль/л)</option>
                    <option value="torsades">Torsades de Pointes / Еклампсія</option>
                </select>
            </div>
        </div>

        <div class="result" id="mg-result"></div>
        <div class="warning" id="mg-warning"></div>
    </div>

    <button class="button" onclick="calculateCurrent()">🧮 РОЗРАХУВАТИ</button>

    <script>
        // ==================== TELEGRAM INTEGRATION ====================
        const tg = window.Telegram?.WebApp;
        if (tg) { 
            tg.expand(); 
            tg.ready();
            tg.MainButton.setText('РОЗРАХУВАТИ').show().onClick(calculateCurrent);
        }

        // ==================== ФУНКЦІЯ TBW ====================
        function calculateTBW(weight, gender, age) {
            if (age > 65) return weight * 0.5;
            return gender === 'male' ? weight * 0.6 : weight * 0.5;
        }

        // ==================== НАТРІЙ ====================
        function calculateNa() {
            const w = parseFloat(document.getElementById('na-weight').value) || 70;
            const age = parseInt(document.getElementById('na-age').value) || 45;
            const gender = document.getElementById('na-gender').value;
            const cur = parseFloat(document.getElementById('na-current').value) || 140;
            const target = parseFloat(document.getElementById('na-target').value) || 135;
            const isChronic = document.getElementById('na-chronicity').value === 'chronic';
            const solNa = parseFloat(document.getElementById('na-solution').value);

            const tbw = calculateTBW(w, gender, age);
            
            let status = '', deficit = 0, volume = 0, rate = 0, hours = 0, solutionName = '';
            let warningText = '';

            const changePerLiter = (solNa - cur) / (tbw + 1);

            if (cur < 135) {
                status = '🔵 ГІПОНАТРІЄМІЯ';
                
                if (solNa === 154) solutionName = 'NaCl 0.9%';
                else if (solNa === 513) solutionName = 'NaCl 3%';
                else solutionName = 'NaCl 5.85%';
                
                const desiredChange = target - cur;
                const litersNeeded = desiredChange / changePerLiter;
                volume = litersNeeded * 1000;
                
                const maxDailyChange = isChronic ? 8 : 10;
                
                if (cur < 120) {
                    volume = 150; 
                    if (solNa === 154) volume = 500; 
                    hours = 0.33; 
                    rate = volume / hours;
                    const expectedChange = changePerLiter * (volume / 1000);
                    warningText = `🔴 ТЯЖКА/СИМПТОМНА ГІПОНАТРІЄМІЯ! Рекомендовано 100-150 мл 3% NaCl болюсно за 20 хв. Очікувана зміна: +${expectedChange.toFixed(1)} ммоль/л. Можна повторити x2-3. Ризик осмотичного демієлінізуючого синдрому при корекції >${maxDailyChange} ммоль/добу!`;
                } else {
                    const maxRatePerHour = isChronic ? (8/24) : (10/24);
                    const hoursNeeded = desiredChange / maxRatePerHour;
                    hours = Math.max(hoursNeeded, 1);
                    rate = volume / hours;
                    warningText = `✅ Корекція. Ціль: +${desiredChange.toFixed(1)} ммоль/л. Макс швидкість зміни: ${maxDailyChange} ммоль/добу (запобігання демієлінізації). Контроль Na⁺ кожні 4-6 год.`;
                }
                
            } else if (cur > 145) {
                status = '🔴 ГІПЕРНАТРІЄМІЯ';
                const waterDeficit = tbw * ((cur / target) - 1); 
                volume = waterDeficit * 1000;
                deficit = waterDeficit * 1000;
                solutionName = '5% глюкоза або 0.45% NaCl';
                
                const desiredDrop = cur - target;
                const maxDailyDrop = 10;
                
                const hoursByDaily = (desiredDrop / maxDailyDrop) * 24;
                hours = Math.max(hoursByDaily, 1);
                rate = volume / hours;
                
                warningText = `✅ Зниження Na⁺. Швидкість ≤ 10 ммоль/добу для уникнення набряку мозку. Контроль Na⁺ кожні 4 год.`;
            } else {
                status = '🟢 НОРМОНАТРІЄМІЯ';
                solutionName = '—';
                warningText = '✅ Рівень натрію в межах норми.';
            }

            document.getElementById('na-result').innerHTML = `
                <div class="result-row"><span class="result-label">Стан:</span><span class="result-value">${status}</span></div>
                <div class="result-row"><span class="result-label">Загальна вода (TBW):</span><span class="result-value">${tbw.toFixed(1)} <span class="result-unit">л</span></span></div>
                ${cur < 135 ? `<div class="result-row"><span class="result-label">Прогноз (з 1л розчину):</span><span class="result-value">+${changePerLiter.toFixed(1)} <span class="result-unit">ммоль/л</span></span></div>` : ''}
                ${cur > 145 ? `<div class="result-row"><span class="result-label">Дефіцит води:</span><span class="result-value">${deficit.toFixed(0)} <span class="result-unit">мл</span></span></div>` : ''}
                <div class="result-row"><span class="result-label">Розчин:</span><span class="result-value">${solutionName}</span></div>
                ${volume > 0 ? `
                <div class="result-row"><span class="result-label">Об'єм:</span><span class="result-value">${volume.toFixed(0)} <span class="result-unit">мл</span></span></div>
                <div class="result-row"><span class="result-label">Швидкість:</span><span class="result-value">${rate.toFixed(0)} <span class="result-unit">мл/год</span></span></div>
                <div class="result-row"><span class="result-label">Тривалість:</span><span class="result-value">${hours.toFixed(1)} <span class="result-unit">год</span></span></div>
                ` : ''}
            `;

            const warnEl = document.getElementById('na-warning');
            warnEl.textContent = warningText;
            warnEl.className = (cur < 120 || cur > 160) ? 'warning danger' : 'warning';
        }

        // ==================== КАЛІЙ ====================
        function calculateK() {
            const w = parseFloat(document.getElementById('k-weight').value) || 70;
            const cur = parseFloat(document.getElementById('k-current').value) || 4.0;
            const solution = document.getElementById('k-solution').value;
            const renal = document.getElementById('k-renal').value;

            const mmolPerMl = solution === '7.5' ? 1.0 : 0.536;
            const solutionName = solution === '7.5' ? 'KCl 7.5%' : 'KCl 4%';

            let status = '', estDeficitStr = '', singleDose = 0, rate = 0, vol = 0, duration = 0, warningText = '';
            let formulaDeficit = 0;

            if (cur < 3.5) {
                status = '🔵 ГІПОКАЛІЄМІЯ';
                formulaDeficit = w * 0.4 * (4.5 - cur);

                if (cur >= 3.0) {
                    estDeficitStr = '≈100–200 ммоль';
                    singleDose = 30; 
                } else if (cur >= 2.5) {
                    estDeficitStr = '≈200–300 ммоль';
                    singleDose = 40;
                } else {
                    estDeficitStr = '≈300–400+ ммоль';
                    singleDose = 50; 
                }

                if (renal === 'severe') {
                    singleDose = singleDose / 2; 
                }

                rate = 10; 
                if (renal === 'severe') rate = 5; 

                vol = singleDose / mmolPerMl;
                duration = singleDose / rate;

                warningText = `Значення «Орієнтовний дефіцит калію» розраховане за емпіричною формулою:
Дефіцит (ммоль) = маса тіла (кг) × 0,4 × (4,5 − K⁺).
Значення в дужках — це орієнтовний загальний дефіцит калію в організмі, характерний для відповідного ступеня гіпокаліємії.
Жодне із наведених значень не є рекомендованою дозою для одноразового введення калію.`;

            }
            else if (cur > 5.0) {
                status = '🔴 ГІПЕРКАЛІЄМІЯ';
                if (cur > 6.5) {
                    warningText = '🔴 ТЯЖКА ГІПЕРКАЛІЄМІЯ! Ca-глюконат 10% 10 мл в/в болюс (захист міокарда)! Інсулін + глюкоза, діаліз.';
                } else {
                    warningText = '⚠️ Гіперкаліємія. Відміна K-зберігаючих препаратів, петльові діуретики, контроль ЕКГ.';
                }
            }
            else {
                status = '🟢 НОРМОКАЛІЄМІЯ';
                warningText = '✅ Рівень калію в межах норми.';
            }

            let resultHTML = `
                <div class="result-row"><span class="result-label">Стан:</span><span class="result-value">${status}</span></div>`;
            
            if (cur < 3.5) {
                resultHTML += `
                <div style="margin-top:16px; margin-bottom:12px; font-size:15px; font-weight:600; color:#93c5fd; text-align: center;">Результати розрахунку</div>
                
                <div class="result-row" style="flex-direction: column; align-items: flex-start; padding-bottom: 12px;">
                    <span class="result-label" style="margin-bottom: 4px; color: #cbd5e1;">Орієнтовний дефіцит калію:</span>
                    <span class="result-value" style="font-size: 16px;">${formulaDeficit.toFixed(1).replace('.', ',')} ммоль</span>
                    <span style="font-size:11px; color:#fbbf24; margin-top: 2px;">(орієнтовний загальний дефіцит калію в організмі: ${estDeficitStr})</span>
                </div>
                
                <div class="result-row" style="flex-direction: column; align-items: flex-start; padding-bottom: 12px;">
                    <span class="result-label" style="margin-bottom: 4px; color: #cbd5e1;">Рекомендована початкова корекція:</span>
                    <span class="result-value" style="font-size: 16px;">${singleDose} ммоль KCl</span>
                    <span style="font-size:11px; color:#94a3b8; margin-top: 2px;">(${vol.toFixed(1).replace('.', ',')} мл обраного розчину KCl)</span>
                </div>
                
                <div class="result-row" style="flex-direction: column; align-items: flex-start; padding-bottom: 12px;">
                    <span class="result-label" style="margin-bottom: 4px; color: #cbd5e1;">Час введення:</span>
                    <span class="result-value" style="font-size: 16px;">${duration.toFixed(1).replace('.', ',')} год</span>
                </div>
                
                <div class="result-row" style="flex-direction: column; align-items: flex-start; padding-bottom: 12px;">
                    <span class="result-label" style="margin-bottom: 4px; color: #cbd5e1;">Швидкість введення:</span>
                    <span class="result-value" style="font-size: 16px;">${rate} ммоль/год</span>
                    <span style="font-size:11px; color:#94a3b8; margin-top: 2px;">(${(rate / mmolPerMl).toFixed(1).replace('.', ',')} мл/год)</span>
                </div>
                
                <div style="margin-top:12px; font-size:12px; color:#94a3b8; line-height:1.5;">
                    <strong style="color:#e2e8f0;">Максимальна швидкість введення:</strong><br>
                    До 20 ммоль/год лише через центральний венозний катетер за умови безперервного ЕКГ-моніторингу.
                </div>
                
                <div style="margin-top:12px; font-size:12px; color:#94a3b8; line-height:1.5;">
                    <strong style="color:#e2e8f0;">Контроль після корекції:</strong><br>
                    Повторне визначення рівня K⁺ через 2–4 години після завершення інфузії. Подальшу корекцію проводити відповідно до повторного рівня K⁺, клінічного стану пацієнта та функції нирок.
                </div>
                `;
            }

            document.getElementById('k-result').innerHTML = resultHTML;

            const warnEl = document.getElementById('k-warning');
            warnEl.textContent = warningText;
            if (cur < 3.5) {
                warnEl.className = 'warning';
                warnEl.style.whiteSpace = 'pre-wrap';
            } else {
                warnEl.className = (cur < 2.5 || cur > 6.5) ? 'warning danger' : 'warning';
                warnEl.style.whiteSpace = 'normal';
            }
        }

        // ==================== КАЛЬЦІЙ ====================
        function calculateCa() {
            const cur = parseFloat(document.getElementById('ca-current').value) || 1.2;
            const alb = parseFloat(document.getElementById('ca-albumin').value) || 40;
            const albUnit = document.getElementById('ca-albumin-unit').value;
            const drug = document.getElementById('ca-drug').value;

            let isTotalCa = cur > 1.5; 
            
            let corr = cur;
            if (isTotalCa) {
                if (albUnit === 'gl') {
                    corr = cur + 0.02 * (40 - alb);
                } else {
                    corr = cur + 0.8 * (4.0 - alb);
                }
            }
            
            let status = '', doseGrams = 0, vol = 0, warningText = '';
            
            let lowerBound = isTotalCa ? 2.2 : 1.1;
            let upperBound = isTotalCa ? 2.6 : 1.3;
            let severeLowerBound = isTotalCa ? 1.9 : 0.9;
            let severeUpperBound = isTotalCa ? 3.0 : 1.5;

            if (corr < lowerBound) {
                status = '🔵 ГІПОКАЛЬЦІЄМІЯ';
                
                if (corr < severeLowerBound) {
                    doseGrams = 2; 
                    warningText = '🔴 ТЯЖКА АБО СИМПТОМНА ГІПОКАЛЬЦІЄМІЯ! Рекомендовано 1-2 г Ca-глюконату за 10-20 хв. Можна повторити. ЕКГ контроль!';
                } else {
                    doseGrams = 1;
                    warningText = '⚠️ Помірна/Легка гіпокальціємія. 1 г Ca-глюконату за 10-20 хв.';
                }
                
                if (drug === 'chloride') {
                    vol = 10; 
                    warningText += ' 🔴 УВАГА: CaCl₂ вводити ТІЛЬКИ в центральну вену! Високий ризик некрозу тканин при екстравазації!';
                } else {
                    vol = doseGrams * 10; 
                }
            } 
            else if (corr > upperBound) {
                status = '🔴 ГІПЕРКАЛЬЦІЄМІЯ';
                if (corr > severeUpperBound) {
                    warningText = '🔴 ТЯЖКА ГІПЕРКАЛЬЦІЄМІЯ! Гідратація NaCl 0.9%, кальцитонін, бісфосфонати!';
                } else {
                    warningText = '⚠️ Гіперкальціємія. Забезпечити гідратацію.';
                }
            } 
            else {
                status = '🟢 НОРМОКАЛЬЦІЄМІЯ';
                warningText = '✅ Рівень кальцію в нормі.';
            }

            document.getElementById('ca-result').innerHTML = `
                <div class="result-row">
                    <span class="result-label">Тип Ca²⁺:</span>
                    <span class="result-value">${isTotalCa ? 'Загальний (скоригований)' : 'Іонізований'}</span>
                </div>
                <div class="result-row">
                    <span class="result-label">Рівень Ca²⁺:</span>
                    <span class="result-value">${corr.toFixed(2)} <span class="result-unit">ммоль/л</span></span>
                </div>
                <div class="result-row">
                    <span class="result-label">Стан:</span>
                    <span class="result-value">${status}</span>
                </div>
                ${doseGrams > 0 ? `
                <div class="result-row">
                    <span class="result-label">Рекомендована доза:</span>
                    <span class="result-value">${drug === 'chloride' ? '1 г' : doseGrams + ' г'}</span>
                </div>
                <div class="result-row">
                    <span class="result-label">Препарат:</span>
                    <span class="result-value">${drug === 'chloride' ? 'CaCl₂ 10%' : 'Ca-глюконат 10%'}</span>
                </div>
                <div class="result-row">
                    <span class="result-label">Об'єм препарату:</span>
                    <span class="result-value">${vol.toFixed(1)} <span class="result-unit">мл</span></span>
                </div>
                <div class="result-row">
                    <span class="result-label">Час введення:</span>
                    <span class="result-value">10-20 <span class="result-unit">хв</span></span>
                </div>
                ` : ''}
            `;

            const warnEl = document.getElementById('ca-warning');
            warnEl.textContent = warningText;
            warnEl.className = (corr < severeLowerBound || corr > severeUpperBound) ? 'warning danger' : 'warning';
        }

        // ==================== МАГНІЙ ====================
        function calculateMg() {
            const cur = parseFloat(document.getElementById('mg-current').value) || 0.8;
            const ind = document.getElementById('mg-indication').value;

            let status = '', doseGrams = 0, warningText = '';

            if (ind === 'torsades') {
                status = '🔴 КРИТИЧНИЙ СТАН';
                doseGrams = 2; 
                warningText = '⚡ TORSADES / ЕКЛАМПСІЯ! Болюс 2 г MgSO₄ (8 мл 25%) за 10-15 хв! При еклампсії 4-6 г навантаження, далі інфузія.';
            } else if (cur < 0.7) {
                status = '🔵 ГІПОМАГНІЄМІЯ';
                
                if (ind === 'severe' || cur < 0.5) {
                    doseGrams = 6; 
                    warningText = '🔴 ТЯЖКА ГІПОМАГНІЄМІЯ! 4-8 г MgSO₄ (16-32 мл 25%) за 12-24 год.';
                } else if (cur < 0.6) {
                    doseGrams = 4; 
                    warningText = '⚠️ Помірна гіпомагніємія. 2-4 г MgSO₄ (8-16 мл 25%) за 4-12 год.';
                } else {
                    doseGrams = 2; 
                    warningText = '✅ Легка гіпомагніємія. 2 г MgSO₄ (8 мл 25%) за 2-4 год.';
                }
            } 
            else if (cur > 1.2) {
                status = '🔴 ГІПЕРМАГНІЄМІЯ';
                warningText = '🔴 ГІПЕРМАГНІЄМІЯ! При симптомах — Кальцію глюконат 10% 10-20 мл в/в!';
            } 
            else {
                status = '🟢 НОРМОМАГНІЄМІЯ';
                warningText = '✅ Рівень магнію в нормі.';
            }
            
            let doseMmol = doseGrams * 4;
            let volMl = doseGrams * 4;

            document.getElementById('mg-result').innerHTML = `
                <div class="result-row"><span class="result-label">Стан:</span><span class="result-value">${status}</span></div>
                ${doseGrams > 0 ? `
                <div class="result-row"><span class="result-label">Доза MgSO₄:</span><span class="result-value">${doseGrams} <span class="result-unit">г</span></span></div>
                <div class="result-row"><span class="result-label">Об'єм MgSO₄ 25%:</span><span class="result-value">${volMl} <span class="result-unit">мл</span></span></div>
                <div class="result-row"><span class="result-label">Елементарний Mg²⁺:</span><span class="result-value">${doseMmol} <span class="result-unit">ммоль</span></span></div>
                ` : ''}
            `;

            const warnEl = document.getElementById('mg-warning');
            warnEl.textContent = warningText;
            warnEl.className = (cur < 0.5 || cur > 1.5 || ind === 'torsades') ? 'warning danger' : 'warning';
        }

        // ==================== НАВІГАЦІЯ ====================
        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
            document.getElementById(`tab-${tabId}`).classList.remove('hidden');
            
            document.querySelectorAll('.tab').forEach(btn => {
                btn.classList.remove('active');
                if (btn.dataset.tab === tabId) btn.classList.add('active');
            });
            calculateCurrent();
        }

        function calculateCurrent() {
            const activeTab = document.querySelector('.tab.active').dataset.tab;
            const calculators = {
                'na': calculateNa,
                'k': calculateK,
                'ca': calculateCa,
                'mg': calculateMg
            };
            if (calculators[activeTab]) calculators[activeTab]();
        }

        // ==================== ІНІЦІАЛІЗАЦІЯ ====================
        document.addEventListener('DOMContentLoaded', function() {
            document.querySelectorAll('.tab').forEach(tab => {
                tab.addEventListener('click', () => switchTab(tab.dataset.tab));
            });

            const allInputs = document.querySelectorAll('input, select');
            allInputs.forEach(input => {
                input.addEventListener('input', calculateCurrent);
                input.addEventListener('change', calculateCurrent);
            });

            calculateNa();
        });
    </script>
</body>
</html>
